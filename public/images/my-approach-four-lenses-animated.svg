<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice"
role="img" aria-label="Animated four-lens approach converging on one problem">
<defs><path id="path0" d="M260,180 Q530.0,230.0 800,350"/><path id="path1" d="M1340,180 Q1070.0,230.0 800,350"/><path id="path2" d="M260,520 Q530.0,470.0 800,350"/><path id="path3" d="M1340,520 Q1070.0,470.0 800,350"/></defs>
<style>
  .beam {
    fill:none;
    stroke-width:1.6;
    opacity:.24;
    stroke-linecap:round;
    stroke-dasharray:4 13;
    animation:flow 10s linear var(--delay) infinite;
  }
  .guide {
    fill:none;
    stroke:#aebdca;
    stroke-width:1;
    opacity:.10;
    stroke-dasharray:3 16;
  }
  .lens {
    animation:breathe 7s ease-in-out infinite alternate;
    transform-box:fill-box;
    transform-origin:center;
  }
  @keyframes flow {
    to { stroke-dashoffset:-68; }
  }
  @keyframes breathe {
    from { opacity:.76; }
    to { opacity:1; }
  }
  @media(prefers-reduced-motion:reduce) {
    .beam,.lens { animation:none!important; }
  }
</style>
<rect width="100%" height="100%" fill="#f8f9fa"/>

<path d="M180,350 C430,250 560,250 800,350 C1040,450 1180,450 1420,350" class="guide"/>
<path d="M180,350 C430,450 560,450 800,350 C1040,250 1180,250 1420,350" class="guide"/>

<g><use href="#path0" class="beam" style="stroke:#4da3ff;--delay:-0.0s"/><use href="#path1" class="beam" style="stroke:#45c3cf;--delay:-1.1s"/><use href="#path2" class="beam" style="stroke:#8d78d8;--delay:-2.2s"/><use href="#path3" class="beam" style="stroke:#8fb7dc;--delay:-3.3s"/></g>
<g><circle r="4.2" fill="#4da3ff"><animateMotion dur="7.0s" begin="0.0s" repeatCount="indefinite"><mpath href="#path0"/></animateMotion><animate attributeName="opacity" values="0;.95;.95;0" keyTimes="0;.12;.82;1" dur="7.0s" begin="0.0s" repeatCount="indefinite"/></circle><circle r="4.2" fill="#45c3cf"><animateMotion dur="7.6s" begin="-1.3s" repeatCount="indefinite"><mpath href="#path1"/></animateMotion><animate attributeName="opacity" values="0;.95;.95;0" keyTimes="0;.12;.82;1" dur="7.6s" begin="-1.3s" repeatCount="indefinite"/></circle><circle r="4.2" fill="#8d78d8"><animateMotion dur="8.2s" begin="-2.6s" repeatCount="indefinite"><mpath href="#path2"/></animateMotion><animate attributeName="opacity" values="0;.95;.95;0" keyTimes="0;.12;.82;1" dur="8.2s" begin="-2.6s" repeatCount="indefinite"/></circle><circle r="4.2" fill="#8fb7dc"><animateMotion dur="8.8s" begin="-3.9s" repeatCount="indefinite"><mpath href="#path3"/></animateMotion><animate attributeName="opacity" values="0;.95;.95;0" keyTimes="0;.12;.82;1" dur="8.8s" begin="-3.9s" repeatCount="indefinite"/></circle></g>
