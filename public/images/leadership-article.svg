<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
<title id="title">Leadership article influence network</title>
<desc id="desc">Animated leadership network with supervisor-style figures and influence signals concentrated on the right side.</desc>

<style>
  .line {
    fill: none;
    stroke: #8ec5ff;
    stroke-width: 1.45;
    opacity: .28;
    stroke-linecap: round;
    stroke-dasharray: 5 9;
    animation: flow 16s linear infinite;
  }
  .line.teal { stroke: #73d2cf; opacity: .26; }
  .line.purple { stroke: #a99af4; opacity: .24; }

  .ring {
    fill: rgba(255,255,255,.72);
    stroke: currentColor;
    stroke-width: 2;
    opacity: .74;
  }

  .leader {
    color: #212529;
  }

  .accent-blue { color: #4da3ff; }
  .accent-teal { color: #45c3cf; }
  .accent-purple { color: #8d78d8; }

  .person {
    fill: none;
    stroke: currentColor;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .node {
    fill: #fff;
    stroke: #8fb7dc;
    stroke-width: 2;
    opacity: .72;
  }

  .dot { fill: #55b7e8; opacity: .68; }
  .dot.purple { fill: #927ce7; }
  .dot.teal { fill: #45c3cf; }

  .pulse {
    transform-box: fill-box;
    transform-origin: center;
    animation: pulse 6.2s ease-in-out infinite;
  }

  .pulse2 {
    transform-box: fill-box;
    transform-origin: center;
    animation: pulse 7.8s ease-in-out -2.2s infinite;
  }

  .float { animation: float 10s ease-in-out infinite; }
  .float2 { animation: float2 12s ease-in-out -3s infinite; }

  .signal {
    opacity: 0;
  }

  @keyframes flow {
    to { stroke-dashoffset: -140; }
  }

  @keyframes pulse {
    0%,100% { transform: scale(1); opacity:.72; }
    50% { transform: scale(1.07); opacity:.96; }
  }

  @keyframes float {
    0%,100% { transform: translate(0,0); }
    50% { transform: translate(6px,-7px); }
  }

  @keyframes float2 {
    0%,100% { transform: translate(0,0); }
    50% { transform: translate(-7px,6px); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>

<!-- keep left side sparse for article copy -->
<g transform="translate(660 0)">

  <!-- influence routes -->
  <path id="p1" class="line" d="M110 115 L290 95 L440 180 L610 105 L790 155"/>
  <path id="p2" class="line teal" d="M110 115 L240 265 L440 180 L520 335 L790 155"/>
  <path id="p3" class="line purple" d="M240 265 L350 395 L520 335 L650 455 L825 340"/>
  <path id="p4" class="line" d="M290 95 L350 395 L610 105 L520 335"/>
  <path id="p5" class="line teal" d="M440 180 L520 335 L650 455"/>
  <path id="p6" class="line purple" d="M520 335 L790 155 L825 340"/>
  <path id="p7" class="line" d="M350 395 L295 520 L520 335 L650 455"/>
  <path id="p8" class="line teal" d="M650 455 L730 535 L825 340"/>

  <!-- travelling influence signals -->
  <circle r="4" fill="#4da3ff" class="signal">
    <animateMotion dur="7s" begin="-1s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion>
    <animate attributeName="opacity" values="0;.9;.9;0" keyTimes="0;.12;.82;1" dur="7s" begin="-1s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#45c3cf" class="signal">
    <animateMotion dur="8.5s" begin="-3s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion>
    <animate attributeName="opacity" values="0;.9;.9;0" keyTimes="0;.12;.82;1" dur="8.5s" begin="-3s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#8d78d8" class="signal">
    <animateMotion dur="9.5s" begin="-5s" repeatCount="indefinite"><mpath href="#p6"/></animateMotion>
    <animate attributeName="opacity" values="0;.88;.88;0" keyTimes="0;.12;.82;1" dur="9.5s" begin="-5s" repeatCount="indefinite"/>
  </circle>

  <!-- small network nodes -->
  <circle class="node" cx="110" cy="115" r="9"/>
  <circle class="dot teal pulse2" cx="290" cy="95" r="7"/>
  <circle class="node" cx="440" cy="180" r="8"/>
  <circle class="dot purple pulse" cx="610" cy="105" r="9"/>
  <circle class="node" cx="790" cy="155" r="10"/>
  <circle class="node" cx="240" cy="265" r="8"/>
  <circle class="dot pulse" cx="350" cy="395" r="8"/>
  <circle class="dot teal" cx="520" cy="335" r="8"/>
  <circle class="node" cx="650" cy="455" r="10"/>
  <circle class="node" cx="825" cy="340" r="8"/>
  <circle class="node" cx="295" cy="520" r="7"/>
  <circle class="dot purple" cx="730" cy="535" r="8"/>

  <!-- central leadership figure -->
  <g transform="translate(555 255)" class="leader pulse">
    <circle class="ring" r="58"/>
    <g class="person">
      <circle cx="0" cy="-13" r="9"/>
      <circle cx="-22" cy="1" r="6.5"/>
      <circle cx="22" cy="1" r="6.5"/>
      <path d="M-15,23 C-13,11 -7,5 0,5 C7,5 13,11 15,23"/>
      <path d="M-34,23 C-32,14 -27,9 -22,9 C-17,9 -12,12 -10,16"/>
      <path d="M34,23 C32,14 27,9 22,9 C17,9 12,12 10,16"/>
    </g>
  </g>

  <!-- secondary leadership figures -->
  <g transform="translate(345 225)" class="accent-blue float pulse2">
    <circle class="ring" r="37"/>
    <g class="person">
      <circle cx="0" cy="-10" r="7"/>
      <circle cx="-17" cy="1" r="5"/>
      <circle cx="17" cy="1" r="5"/>
      <path d="M-12,18 C-10,9 -5,4 0,4 C5,4 10,9 12,18"/>
      <path d="M-26,18 C-24,11 -21,8 -17,8 C-13,8 -9,10 -7,14"/>
      <path d="M26,18 C24,11 21,8 17,8 C13,8 9,10 7,14"/>
    </g>
  </g>

  <g transform="translate(700 420)" class="accent-teal float2 pulse">
    <circle class="ring" r="38"/>
    <g class="person">
      <circle cx="0" cy="-10" r="7"/>
      <circle cx="-17" cy="1" r="5"/>
      <circle cx="17" cy="1" r="5"/>
      <path d="M-12,18 C-10,9 -5,4 0,4 C5,4 10,9 12,18"/>
      <path d="M-26,18 C-24,11 -21,8 -17,8 C-13,8 -9,10 -7,14"/>
      <path d="M26,18 C24,11 21,8 17,8 C13,8 9,10 7,14"/>
    </g>
  </g>

  <!-- individual people influenced by the wider system -->
  <g transform="translate(790 250)" class="accent-purple float">
    <circle class="ring" r="31"/>
    <g class="person">
      <circle cx="0" cy="-9" r="6"/>
      <path d="M-12,16 C-10,7 -5,2 0,2 C5,2 10,7 12,16"/>
    </g>
  </g>

  <g transform="translate(430 500)" class="accent-blue float2">
    <circle class="ring" r="29"/>
    <g class="person">
      <circle cx="0" cy="-8" r="5.5"/>
      <path d="M-11,15 C-9,7 -5,2 0,2 C5,2 9,7 11,15"/>
    </g>
  </g>

  <!-- ambient points -->
  <g opacity=".35">
    <circle cx="185" cy="165" r="3" fill="#8fb7dc"/>
    <circle cx="375" cy="105" r="4" fill="#45c3cf"/>
    <circle cx="490" cy="120" r="3" fill="#8d78d8"/>
    <circle cx="675" cy="205" r="4" fill="#4da3ff"/>
    <circle cx="770" cy="500" r="3" fill="#45c3cf"/>
    <circle cx="575" cy="535" r="3" fill="#8d78d8"/>
  </g>

</g>
</svg>